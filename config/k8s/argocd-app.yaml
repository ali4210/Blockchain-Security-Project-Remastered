apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blockchain-soc-pipeline
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'file:///home/kali/Blockchain-Security-Project-Remastered'
    targetRevision: HEAD
    path: config/k8s/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: blockchain-soc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
