apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-security-relayer
  namespace: blockchain-soc
  labels:
    app.kubernetes.io/name: soc-security-relayer
    tier: security-relayer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-security-relayer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soc-security-relayer
        tier: security-relayer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: relayer
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: alpine:latest
          command: ["/bin/sh", "-c", "while true; do echo '[SOC-RELAYER] Active and monitoring chain state...'; sleep 30; done"]
          resources:
            limits:
              cpu: "250m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-relayer-ingress
  namespace: blockchain-soc
spec:
  podSelector:
    matchLabels:
      tier: security-relayer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: consensus-validator
      ports:
        - protocol: TCP
          port: 8545
