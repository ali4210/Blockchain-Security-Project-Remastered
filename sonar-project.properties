sonar.projectKey=blockchain-security-soc
sonar.projectName=Blockchain-Security-Project-Remastered
sonar.projectVersion=1.0.0
sonar.sources=contracts,scripts
sonar.tests=test
sonar.sourceEncoding=UTF-8
sonar.exclusions=out/**,cache/**,node_modules/**,lib/**
# scripts/** verified via live integration tests against real external systems
# (DefectDojo, Vault, TheHive, Langfuse, etc.), not mocked unit tests -- excluded
# from the COVERAGE condition only (bugs/smells/duplication/hotspots stay fully
# enforced). Also set live via the SonarQube API on the project itself; mirrored
# here so it survives a project reprovision instead of silently reverting.
sonar.coverage.exclusions=scripts/**
