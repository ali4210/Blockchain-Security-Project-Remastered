play.http.secret.key = "soc-blockchain-enterprise-forensic-secret-key-2026"

# JanusGraph embedded local database backend
db.janusgraph.storage.backend = "berkeleyje"
db.janusgraph.storage.directory = "/opt/thp/data/db"

# Local filesystem storage for files and forensic evidence
storage.provider = localfs
storage.localfs.location = "/opt/thp/data/files"

# Prevent search cluster connection loops in standalone mode
search.backend = "noop"
